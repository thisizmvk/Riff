# XcodeGen project definition.
#
# Contributors run:
#   brew install xcodegen
#   xcodegen generate
#   open Riff.xcodeproj
#
# project.yml is the source of truth; Riff.xcodeproj is generated and
# .gitignored.

name: Riff
options:
  bundleIdPrefix: dev.riff
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  # Freeze the generated project format in the repo instead of
  # inheriting whatever the installed XcodeGen's default is:
  # xcodeVersion "16.0" writes pbxproj objectVersion 77 (needs Xcode 16
  # to open), and minimumXcodeGenVersion fails generation loudly on an
  # XcodeGen old enough to emit something else. CI installs XcodeGen
  # 2.45.4 pinned by sha256 (see .github/workflows/ci.yml).
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.44.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode 16 recommended settings — encoded here so xcodegen
    # regenerate doesn't lose them.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Riff:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    # RiffWidget app-extension target is intentionally not declared (and
    # therefore not depended on) — see the disabled-target comment block
    # after the test target for the rationale and the steps to re-enable.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Riff
        CFBundleDisplayName: Riff
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026. AGPL-3.0."
        # AppIntents usage description — surfaced if Siri invokes a
        # Riff intent on macOS. Spotlight + Shortcuts invocations do
        # not require this key, but including it keeps the
        # voice-invocation path consent-clean.
        NSSiriUsageDescription: "Riff uses Siri to play music, skip tracks, and start artist radio stations."
    entitlements:
      # NOTE: XcodeGen regenerates Sources/Riff.entitlements from
      # THIS properties block on every `xcodegen generate`. Any hand
      # edit to the .entitlements file is overwritten — add/remove
      # capabilities here, not there.
      path: Sources/Riff.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sandbox file access. Both are plain sandbox entitlements —
        # they provision on a free personal team.
        #  - user-selected: the lyric-card NSSavePanel write
        #    (LyricCardSheet). Without it the powerbox grant for the
        #    picked URL is unusable and every save fails with
        #    "You don't have permission".
        #  - downloads: Settings → Export diagnostics writes its dump
        #    into ~/Downloads (DiagnosticsExporter); the container's
        #    Downloads symlink is denied without this.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        # PASSKEY SIGN-IN (WebAuthn in the sign-in WKWebView).
        # Passkeys are driven by Google's own login page; Riff builds
        # no passkey UI. For the WKWebView to invoke the platform
        # authenticator (Touch ID / iCloud Keychain) with google.com
        # as the relying party, uncomment the capability below.
        #
        # Requires a PAID Apple Developer account — like App Groups,
        # it will NOT provision on a free personal team. Apple gates
        # this capability (intended for browser apps) and may reject
        # it for a music client. Test the full Google passkey flow on
        # a real signed build before relying on it. Without it,
        # Google's page falls back to password + 2FA, which works.
        #
        # com.apple.developer.web-browser.public-key-credential: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.riff.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/Riff.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # CFBundleVersion git-rev-count stamping as a postCompileScript is
    # disabled: it ran AFTER Xcode's signing phase, which invalidates
    # the signature (errSecCS -67030) and prevents standalone launch +
    # WidgetKit extension registration on free-dev accounts. Tagged
    # releases are stamped instead by .github/workflows/release.yml
    # ("Stamp version from tag"): PlistBuddy rewrites the generated
    # Sources/Info.plist after `xcodegen generate` and BEFORE the build,
    # so the signature covers the stamped values. The 0.1.0 / 1 in the
    # info block above are therefore only the local-dev defaults.

  RiffTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Riff
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Riff.app/Contents/MacOS/Riff"
        GENERATE_INFOPLIST_FILE: YES

# ─────────────────────────────────────────────────────────────────────────
# RiffWidget — DISABLED.
#
# The Notification Center widget extension target is not declared while
# the project is on a free Apple Developer account. macOS 27 filters
# free-team-signed widget extensions out of the System Settings widget
# gallery, chronod never enumerates them, and WidgetKit Simulator returns
# error 5 on AppIntent + App-Group widgets — so there is no path to
# install or even render this widget without a paid team.
#
# To re-enable when a paid Developer Program seat is available:
#   1. Restore the `dependencies: - target: RiffWidget` block under the
#      Riff target above.
#   2. Paste this target definition back in, immediately above RiffTests:
#
#        RiffWidget:
#          type: app-extension
#          platform: macOS
#          sources:
#            - path: RiffWidget
#            - path: Sources/Widgets/NowPlayingSnapshot.swift
#            - path: Sources/Widgets/RiffWidgetIntents.swift
#          info:
#            path: RiffWidget/Info.plist
#            properties:
#              CFBundleName: RiffWidget
#              CFBundleDisplayName: Riff Widget
#              CFBundleShortVersionString: "0.1.0"
#              CFBundleVersion: "1"
#              CFBundlePackageType: XPC!
#              NSExtension:
#                NSExtensionPointIdentifier: com.apple.widgetkit-extension
#          entitlements:
#            path: RiffWidget/RiffWidget.entitlements
#          settings:
#            base:
#              PRODUCT_BUNDLE_IDENTIFIER: dev.riff.app.widget
#              CODE_SIGN_STYLE: Automatic
#              CODE_SIGN_ENTITLEMENTS: RiffWidget/RiffWidget.entitlements
#              SKIP_INSTALL: YES
#
#   3. Add the App Group entitlement back to BOTH Sources/Riff.entitlements
#      and RiffWidget/RiffWidget.entitlements:
#
#        <key>com.apple.security.application-groups</key>
#        <array>
#          <string>group.dev.riff.app</string>
#        </array>
#
#   4. `xcodegen generate && xcodebuild -scheme Riff build`
#
# The widget source — RiffWidget/, Sources/Widgets/ — stays in the repo
# unchanged so the diff to re-enable is minimal. The app target still
# compiles those Sources/Widgets files; the in-app NowPlayingSnapshotWriter
# keeps calling WidgetCenter.shared.reloadTimelines (which no-ops with no
# extensions registered), so nothing else needs to change here.
# ─────────────────────────────────────────────────────────────────────────
