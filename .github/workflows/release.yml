# Cuts a GitHub Release whenever a v* tag is pushed.
#
# Build flow:
#   1. Same toolchain as CI (macos-15 + Xcode 16) so the binary is
#      bit-identical to what xcodebuild produces locally.
#   2. Stamp CFBundleShortVersionString (tag minus the leading v) and
#      CFBundleVersion (git rev-list --count HEAD) into the generated
#      Sources/Info.plist BEFORE the build — post-compile stamping would
#      invalidate the code signature (errSecCS -67030).
#   3. Build the Release configuration so the user gets an optimized
#      binary, not the assertion-heavy Debug build.
#   4. If Developer ID secrets are configured, re-sign with the stable
#      identity, notarize (notarytool submit --wait) and staple. With
#      no secrets the build ships ad-hoc signed. NOTE the ad-hoc
#      trade-offs, spelled out in the generated install notes:
#        - macOS 14 users open it with right-click → Open; macOS 15+
#          REMOVED that bypass — users must go to System Settings →
#          Privacy & Security → "Open Anyway".
#        - the ad-hoc designated requirement is the per-build cdhash,
#          so every update re-prompts once per stored Keychain secret
#          (OAuth tokens, API keys); users must pick "Always Allow".
#      Only Apple-issued Developer ID signing (stable team ID) removes
#      both problems — that's why the secrets path exists.
#   5. Package a .dmg (app + /Applications symlink) and a zip, plus
#      .sha256 files for both, and attach everything to the Release.
#
# To cut a release:
#   git tag v0.1.0 -m "v0.1.0"
#   git push origin v0.1.0
#
# Release notes = the CHANGELOG.md section for the tag (when present)
# + install notes + GitHub's autogenerated "What's Changed" list.
#
# Optional signing secrets (all six required for the full path):
#   MACOS_CERT_P12        the Developer ID Application .p12, Base64-encoded
#   MACOS_CERT_PASSWORD   password for the .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD
#                         Apple ID + team + app-specific password for
#                         notarytool (first three enable signing only)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create releases + upload artifacts

# Tag-derived values live in env and are referenced as shell variables
# inside run blocks — never via template interpolation in scripts
# (template expansion into shell is an injection surface).
env:
  TAG: ${{ github.ref_name }}

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # for the git rev-list --count HEAD stamp
          # Don't leave the contents:write token in .git/config where
          # any later step (or compromised tool) could read it; the
          # steps that need the token get it explicitly via GH_TOKEN.
          persist-credentials: false

      - name: Select Xcode 16.x
        # No third-party action: pick the newest installed Xcode 16
        # directly. Fails loudly if the runner image drops 16.x.
        run: |
          ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 > "$RUNNER_TEMP/xcode_path"
          if [ ! -s "$RUNNER_TEMP/xcode_path" ]; then
            echo "::error::No Xcode 16.x found on this runner image"
            exit 1
          fi
          read -r XCODE_APP < "$RUNNER_TEMP/xcode_path"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen (pinned + checksummed)
        # brew can't pin; the tagged release zip can. Version and hash
        # move together — bump both when upgrading.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 2.45.4 \
            --repo yonaskolb/XcodeGen \
            --pattern xcodegen.zip \
            --dir "$RUNNER_TEMP"
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" > "$RUNNER_TEMP/xcodegen.zip.sha256"
          shasum -a 256 -c "$RUNNER_TEMP/xcodegen.zip.sha256"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-dist"
          echo "$RUNNER_TEMP/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate

      - name: Stamp version from tag
        # After xcodegen generate (which writes Sources/Info.plist),
        # before the build (so the signed bundle carries the stamp).
        run: |
          VERSION="${TAG#v}"
          # CFBundleShortVersionString must be a plain dotted version;
          # fail before the (expensive) build on a tag like v0.2.0-beta1
          # or a hostile refname rather than shipping a bad stamp.
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR[.PATCH] — CFBundleShortVersionString needs a plain dotted version"
            exit 1
          fi
          git rev-list --count HEAD > "$RUNNER_TEMP/build_num"
          read -r BUILD < "$RUNNER_TEMP/build_num"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" Sources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" Sources/Info.plist
          {
            echo "VERSION=${VERSION}"
            echo "BUILD_NUM=${BUILD}"
          } >> "$GITHUB_ENV"
          echo "Stamped CFBundleShortVersionString=${VERSION} CFBundleVersion=${BUILD}"

      - name: Check signing secrets
        id: creds
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          if [ -n "$CERT_P12" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$SIGN_IDENTITY" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID secrets configured — shipping an ad-hoc-signed build."
          fi
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Riff \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_STYLE=Automatic \
            build

      - name: Locate .app
        run: |
          find build/Build/Products/Release -maxdepth 2 -name "Riff.app" -type d | head -1 > "$RUNNER_TEMP/app_path"
          if [ ! -s "$RUNNER_TEMP/app_path" ]; then
            echo "::error::Riff.app not found under build/Build/Products/Release"
            exit 1
          fi
          read -r APP_PATH < "$RUNNER_TEMP/app_path"
          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"
          echo "Found at ${APP_PATH}"

      - name: Verify version stamp in built app
        # Assert against the BUILT bundle, not the source plist — this is
        # what guarantees "About" and diagnostics manifests won't report
        # 0.1.0 (1) for every tagged release.
        run: |
          GOT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          GOT_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          if [ "$GOT_VERSION" != "$VERSION" ] || [ "$GOT_BUILD" != "$BUILD_NUM" ]; then
            echo "::error::Built app reports ${GOT_VERSION} (${GOT_BUILD}); expected ${VERSION} (${BUILD_NUM}) from the tag stamp"
            exit 1
          fi
          echo "Built app carries ${GOT_VERSION} (${GOT_BUILD})"

      - name: Import Developer ID certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/riff-signing.keychain-db"
          uuidgen > "$RUNNER_TEMP/kc_pass"
          read -r KEYCHAIN_PASSWORD < "$RUNNER_TEMP/kc_pass"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # The secret holds the .p12 Base64-encoded (GitHub secrets are
          # text-only); turn it back into the binary file that
          # security import needs.
          printf '%s' "$CERT_P12" > "$RUNNER_TEMP/cert.p12.txt"
          /usr/bin/base64 -D -i "$RUNNER_TEMP/cert.p12.txt" -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.p12.txt" "$RUNNER_TEMP/kc_pass"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

      - name: Sign with Developer ID
        if: steps.creds.outputs.sign == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          # No --deep: Riff.app has no nested bundles, and --deep would
          # smear the app entitlements onto any future nested code.
          # Keep the entitlements so the sandbox isn't lost on re-sign.
          codesign --force --options runtime --timestamp \
            --entitlements Sources/Riff.entitlements \
            --sign "$SIGN_IDENTITY" \
            "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple
        if: steps.creds.outputs.sign == 'true' && steps.creds.outputs.notarize == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Riff-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Riff-notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          # staple fails if notarization didn't actually succeed, so an
          # "Invalid" submission can't slip through as a green job.
          xcrun stapler staple "$APP_PATH"

      - name: Package (zip + dmg + checksums)
        run: |
          ZIP="Riff-${TAG}-macOS.zip"
          DMG="Riff-${TAG}-macOS.dmg"
          VERSION="${TAG#v}"
          # ditto preserves macOS bundle metadata (extended attrs,
          # codesign signatures) where plain zip would mangle them.
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          ditto "$APP_PATH" "$STAGE/Riff.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Riff ${VERSION}" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          {
            echo "ZIP=$ZIP"
            echo "DMG=$DMG"
          } >> "$GITHUB_ENV"

      - name: Compose release notes
        env:
          SIGNED: ${{ steps.creds.outputs.sign }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          VERSION="${TAG#v}"
          # CHANGELOG.md section for this tag, when one exists. The
          # /^\[/ rule stops at the trailing link-reference block.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## /{p = (index($0, "[" ver "]") > 0)}
              /^\[/{p = 0}
              p' CHANGELOG.md >> "$NOTES"
          fi
          {
            echo ""
            echo "## Install"
            echo ""
            echo "Download **$DMG** (open it and drag Riff to Applications)"
            echo "or **$ZIP**. A .sha256 file is attached for both."
            echo ""
          } >> "$NOTES"
          if [ "$SIGNED" = "true" ]; then
            echo "This build is Developer ID signed." >> "$NOTES"
          else
            {
              echo "**This build is ad-hoc signed** (no paid Apple Developer"
              echo "account yet), which has two consequences:"
              echo ""
              echo "- **First launch:** on macOS 14, right-click Riff.app and"
              echo "  choose *Open*. macOS 15 and later removed that bypass —"
              echo "  after the blocked first launch, go to *System Settings →"
              echo "  Privacy & Security* and click **Open Anyway**."
              echo "- **After an update:** macOS asks once per stored secret"
              echo "  (sign-in tokens, API keys) whether the new build may read"
              echo "  the Keychain. Choose **Always Allow** — *Deny* signs you"
              echo "  out and drops your saved keys."
            } >> "$NOTES"
          fi
          echo "NOTES_PATH=$NOTES" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --generate-notes appends the autogenerated "What's Changed"
          # commit list to the composed notes body (changelog + install
          # notes). Editable on github.com afterwards.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_PATH" \
            --generate-notes \
            --latest \
            "$ZIP" "$ZIP.sha256" \
            "$DMG" "$DMG.sha256"
